<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mayas Restaurant">
<meta name="theme-color" content="#CFE8DD">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Maya's Restaurant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: one-screen app; stacked screens over a tiled kitchen wall; sticker-outlined cards and a canvas "countertop" */
:root{
  --tile:#CFE8DD; --grout:#BBDCCE; --ink:#3B2218; --paper:#FFFBF2;
  --yolk:#FFC93C; --tomato:#EF4F3A; --basil:#2F8F5B; --muted:#7A5A48;
  --display:'Bagel Fat One','ZCOOL KuaiLe','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  --body:'Baloo 2','Noto Sans SC',ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background-color:var(--tile);
  background-image:url(sprites/tex-tiles.webp),linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:240px 240px,52px 52px,52px 52px;color:var(--ink);font-family:var(--body);font-size:16px;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{
  height:100%;max-width:580px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 12px;
}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tomato);outline-offset:3px}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px 14px;padding-top:6px}
.pip-wrap svg{width:118px;height:auto;display:block;animation:bob 2.6s ease-in-out infinite}
h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,10vw,56px);line-height:.92;margin:0;color:var(--tomato);text-shadow:3px 4px 0 var(--ink);text-wrap:balance}
.lede{grid-column:1/-1;margin:2px 0 0;font-size:18px;font-weight:600;line-height:1.35;max-width:36ch}
.label{font-family:var(--display);font-weight:400;font-size:20px;margin:4px 0 0;letter-spacing:.01em}
.levels{display:flex;flex-direction:column;gap:12px}
.level{
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"name age" "desc desc";gap:2px 10px;align-items:center;
  text-align:left;border:3px solid var(--ink);border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--ink);
}
.level[data-level="little"]{background:#FFE7A0}
.level[data-level="home"]{background:#FFD2C4}
.level[data-level="head"]{background:#CBD5F2}
.lname{grid-area:name;font-family:var(--display);font-size:25px;line-height:1}
.age{grid-area:age;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ldesc{grid-area:desc;font-size:15px;font-weight:600;line-height:1.3}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.foot-row span{font-weight:700}

/* shared bits */
.bar{display:flex;align-items:center;gap:10px;min-height:40px}
.ghost{font-weight:700;font-size:15px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:5px 14px;white-space:nowrap}
.chip{font-weight:700;font-size:14px;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 12px;white-space:nowrap}
.stars-total{margin-left:auto;font-family:var(--display);font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.star{color:#F2B400}
.btn{font-family:var(--display);font-size:22px;background:var(--yolk);border:3px solid var(--ink);border-radius:16px;padding:9px 26px;box-shadow:0 5px 0 var(--ink)}
.btn.alt{background:var(--paper)}
.btn:active,.level:active,.card:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* recipe menu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding-bottom:14px}
.card{
  display:grid;grid-template-columns:76px 1fr;grid-template-rows:auto auto auto;gap:2px 12px;align-items:center;
  background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 5px 0 var(--ink);text-align:left;min-width:0;
}
.card canvas{grid-row:1/4;width:76px;height:76px}
.cname{font-family:var(--display);font-size:19px;line-height:1.05;min-width:0}
.cmeta{font-size:13px;font-weight:600;color:var(--muted);line-height:1.25}
.cstars{font-size:19px;letter-spacing:2px;line-height:1}
.cstars .off{color:rgba(59,34,24,.18)}
.card[disabled]{cursor:not-allowed;box-shadow:0 2px 0 var(--ink);background:#EEF1EC}
.card[disabled] canvas{filter:grayscale(1);opacity:.45}
.lock{font-size:13px;font-weight:800;color:var(--tomato)}
.bistro{grid-column:1/-1;background:var(--paper);border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.awning{height:26px;background:repeating-linear-gradient(90deg,var(--tomato) 0 26px,var(--paper) 26px 52px);border-bottom:3px solid var(--ink)}
.bistro-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.bistro h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.bistro p{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.meter{height:12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--yolk)}
.bistro small{font-weight:700;color:var(--muted);font-size:13px}

/* cooking */
.cook-title{flex:1;min-width:0}
.cook-title b{font-family:var(--display);font-weight:400;font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.pips i{width:20px;height:8px;border-radius:4px;border:2px solid var(--ink);background:var(--paper)}
.pips i.done{background:var(--yolk)}
.pips i.now{background:var(--tomato)}
.instr{margin:-4px 0 0;font-weight:800;font-size:17px;line-height:1.25;min-height:1.25em}
.timer{height:10px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;flex:none}
.timer i{display:block;height:100%;width:100%;background:var(--basil);transform-origin:left}
.timer.low i{background:var(--tomato)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#cv{display:block;touch-action:none;border-radius:22px;box-shadow:0 0 0 3px var(--ink),0 7px 0 3px var(--ink)}
.ready{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(59,34,24,.30);border-radius:22px}
.ready-card{
  background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:16px 20px 20px;box-shadow:0 6px 0 var(--ink);
  width:min(320px,calc(100% - 32px));box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.ready-card .pip-sm svg{width:62px;height:auto;display:block}
.pip-wrap img.maya{width:118px;height:auto;display:block;animation:bob 2.6s ease-in-out infinite}
.ready-card .pip-sm img.maya{height:110px;width:auto;display:block}
.start-head img.maya{height:84px;width:auto;display:block}
img.maya{-webkit-user-drag:none;user-select:none}
.last{margin:0;font-weight:800;color:var(--basil);font-size:14px;line-height:1.3}
.stepno{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ready-card h3{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.05;margin:0;text-wrap:balance}
.ready-card p.hint{margin:0;font-weight:600;font-size:15px;line-height:1.35}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-block:6px 18px}
#dishCv{width:190px;height:190px}
.result h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1;text-wrap:balance}
.big-stars{font-size:46px;letter-spacing:6px;line-height:1}
.big-stars span{display:inline-block;animation:popin .45s cubic-bezier(.3,1.6,.5,1) backwards}
.big-stars .off{color:rgba(59,34,24,.18)}
.res-line{margin:0;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.unlock{margin:0;font-weight:800;color:var(--paper);background:var(--basil);border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px}
.steps{list-style:none;padding:0;margin:4px 0;width:100%;max-width:380px;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:7px 12px;font-weight:600;text-align:left}
.steps li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}

.set-title{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,44px);margin:0;color:var(--tomato);text-shadow:3px 4px 0 var(--ink)}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lang{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:10px 14px;font-family:var(--display);font-size:21px;line-height:1.1;box-shadow:0 4px 0 var(--ink);text-align:left}
.lang small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lang.on{background:var(--yolk)}
.lang:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.vol{display:grid;grid-template-columns:84px minmax(0,1fr) 46px;align-items:center;gap:12px;max-width:400px;font-weight:800}
.vol input{width:100%;accent-color:var(--tomato);height:28px}
.vol-now{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:400px;font-weight:700;font-size:14px;color:var(--muted)}
.vol span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.set-row{justify-content:flex-start;padding-bottom:12px}
.start-head{display:flex;align-items:center;gap:12px}
.start-head svg{width:64px;height:auto;display:block}
.savebox{display:flex;flex-direction:column;gap:8px;max-width:380px}
.savebtns{display:grid;grid-template-columns:1fr;gap:10px}
.savebtns .btn{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--ink);transform:none}
.btn.danger{background:var(--tomato);color:var(--paper)}
.confirm{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--ink)}
.confirm p{margin:0;font-weight:700;line-height:1.35}
.slot{margin:0;font-weight:700;font-size:14px;line-height:1.35}
.slot.ok{color:var(--basil)}
.slot.note{font-weight:600;font-size:13px;color:var(--muted)}
#settings{padding-bottom:16px}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:max(16px,calc(env(safe-area-inset-right,0px) + 10px));z-index:30;width:40px;height:40px;padding:6px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
#gear svg{width:24px;height:24px;display:block}
#gear:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.newgame{display:flex;flex-direction:column;gap:10px;max-width:440px;padding-bottom:16px}
.newgame input{font:inherit;font-weight:800;font-size:20px;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:inset 0 3px 0 rgba(59,34,24,.12);min-width:0}
.newgame .level{opacity:.7}.newgame .level.sel{opacity:1;outline:4px solid var(--tomato);outline-offset:3px}
.slot.warn{color:var(--tomato);font-weight:800}
.lang.dbg{max-width:320px}
#startBtns{margin-top:6px}
#bistro{position:relative}
.bis-head{background:var(--paper);border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--ink);flex:none}
.bis-stats{display:flex;gap:4px 16px;flex-wrap:wrap;padding:8px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.bis-msg{flex-basis:100%;margin:0;color:var(--basil);font-weight:800}
.seats{display:flex;flex-direction:column;gap:12px;padding:12px;margin-bottom:14px;border:3px solid var(--ink);border-radius:20px;background:#D9925A url(sprites/tex-planks.webp) center/320px;box-shadow:inset 0 4px 0 rgba(59,34,24,.25)}
.seat{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 var(--ink)}
.seat.empty{display:flex;align-items:center;justify-content:center;min-height:70px;background:rgba(255,251,242,.45);border-style:dashed;box-shadow:none;color:var(--muted);font-weight:700;text-align:center}
.seat.eat{background:#E2F3E6}.seat.leave{background:#F6E1DC}
.ava svg,.ava img{width:64px;height:auto;display:block}
.seat-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.seat-main b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1}
.say{font-size:14px;font-weight:600;line-height:1.25}
.ticket{display:flex;align-items:center;gap:8px;background:#FFF4CF;border:2px dashed var(--ink);border-radius:10px;padding:3px 8px;font-weight:700;font-size:14px;min-width:0}
.ticket canvas{width:34px;height:34px;flex:none}
.ticket .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{white-space:nowrap;font-variant-numeric:tabular-nums}
.paid{font-family:var(--display);color:var(--basil);font-size:18px}
.pat{height:9px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.pat i{display:block;height:100%;background:var(--basil);transform-origin:left}
.pat.mid i{background:var(--yolk)}.pat.low i{background:var(--tomato)}
.btn.small{font-size:17px;padding:7px 14px;box-shadow:0 4px 0 var(--ink)}
.seat .btn{grid-column:2;justify-self:start}
.svc{display:flex;align-items:center;gap:10px;background:#FFF4CF;border:2.5px solid var(--ink);border-radius:12px;padding:5px 10px;font-weight:700;font-size:14px;margin-top:-6px}
.svc .pat{flex:1;min-width:60px}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:var(--yolk) url(sprites/bis-coin.webp) center/contain no-repeat;border:0;vertical-align:-.08em;margin-right:4px;box-sizing:border-box}
.bistro-body .btn{align-self:flex-start;margin-top:4px}
.carte-title{font-size:clamp(22px,6.4vw,32px);line-height:1.05}
.carte-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#carteCount{white-space:normal}
.carte-hint{margin:-6px 0 0;font-weight:600;line-height:1.35}
.carte-warn{margin:0;font-weight:800;color:var(--tomato)}
.card.pick{position:relative;grid-template-rows:auto auto auto auto;cursor:pointer}
.card.pick canvas{grid-row:1/5}
.carte-sub{margin-top:-10px;font-size:14px;color:var(--muted)}
.pricer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pricer b{font-family:var(--display);font-weight:400;font-size:19px;min-width:6ch;text-align:center;white-space:nowrap}
.pbtn{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);font-weight:900;font-size:18px;line-height:1;padding:0;box-shadow:0 3px 0 var(--ink)}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card.pick.on{background:#FFE7A0}
.card.pick:not(.on) canvas{opacity:.45;filter:grayscale(.7)}
.card .onmenu{font-size:13px;font-weight:800;color:var(--basil)}
.card:not(.on) .onmenu{color:var(--muted)}
.card .tick{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-weight:900;font-size:15px;line-height:1}
.card.on .tick{background:var(--basil);color:#fff}
.ready-card .ghost{margin-top:4px}
.bistro-body .store{width:110px;height:auto;align-self:flex-start;margin-bottom:2px}
.big-stars img{width:58px;height:auto;display:inline-block;animation:popin .45s cubic-bezier(.3,1.6,.5,1) backwards;margin:0 3px}
.lock img{width:16px;height:auto;vertical-align:-3px;margin-right:4px}
@media (max-width:380px){.seat{grid-template-columns:52px minmax(0,1fr)}.ava svg,.ava img{width:52px}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes popin{from{transform:scale(0) rotate(-30deg)}}
@media (prefers-reduced-motion:reduce){.pip-wrap img,.pip-wrap svg,.big-stars span{animation:none}}
</style>

</head>
<body>
<div id="app">
  <button id="gear" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8.4 4.6-.1-2.4 2-1.6-2-3.4-2.4.9-2-1.2L15.5 3h-4l-.4 2.5-2 1.2-2.4-.9-2 3.4 2 1.6v2.4l-2 1.6 2 3.4 2.4-.9 2 1.2.4 2.5h4l.4-2.5 2-1.2 2.4.9 2-3.4-2-1.6Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="var(--paper)"/></svg></button>

  <section id="start" class="screen scroll">
    <header class="hero">
      <div class="pip-wrap" data-pip="idle"></div>
      <h1 id="startName">Maya's Restaurant</h1>
      <p class="lede" data-i18n="Chop, stir, flip and bake your way from fruit salad to soufflé.">Chop, stir, flip and bake your way from fruit salad to soufflé.</p>
    </header>
    <div class="savebox" id="startBtns">
      <button class="btn" id="contBtn" type="button" data-i18n="Continue">Continue</button>
      <p class="slot" id="slotInfo"></p>
      <button class="btn alt" id="loadBtn" type="button" data-i18n="Load game">Load game</button>
      <p class="slot" id="loadInfo"></p>
      <button class="btn alt" id="newBtn" type="button" data-i18n="New game">New game</button>
      <p class="slot note" data-i18n="Progress is saved automatically.">Progress is saved automatically.</p>
    </div>
    <form class="newgame" id="newForm" hidden>
      <label class="label" for="newName" data-i18n="Restaurant name">Restaurant name</label>
      <input id="newName" type="text" maxlength="24" autocomplete="off" spellcheck="false">
      <h3 class="label" data-i18n="Difficulty">Difficulty</h3>
    <div class="levels" id="newLevels">
      <button class="level" data-level="little" type="button"><span class="lname" data-i18n="Little Chef">Little Chef</span><span class="age" data-i18n="Ages 3–6">Ages 3–6</span><span class="ldesc" data-i18n="No timers, big targets. Every dish turns out yummy.">No timers, big targets. Every dish turns out yummy.</span></button>
      <button class="level" data-level="home" type="button"><span class="lname" data-i18n="Home Cook">Home Cook</span><span class="age" data-i18n="Ages 7–11">Ages 7–11</span><span class="ldesc" data-i18n="Timers and scores. Earn three stars on every recipe.">Timers and scores. Earn three stars on every recipe.</span></button>
      <button class="level" data-level="head" type="button"><span class="lname" data-i18n="Head Chef">Head Chef</span><span class="age" data-i18n="Ages 12+">Ages 12+</span><span class="ldesc" data-i18n="Tight timing, hidden counters and extra recipe steps.">Tight timing, hidden counters and extra recipe steps.</span></button>

function itemGeo(it){const im=spr('ing-'+it.key);if(!im)return{x0:it.x0,x1:it.x1,hh:it.hh,sp:false};const bw=it.round?230:320,bh=it.round?180:130,k=Math.min(bw/im.width,bh/im.height),dw=im.width*k,dh=im.height*k;return{x0:200-dw/2,x1:200+dw/2,hh:dh/2,sp:true}}
function drawItem(g,it,x0,x1,cy,HH){const im=spr('ing-'+it.key);if(im){const h2=HH||it.hh;drawSpr(g,im,x0,cy-h2,x1-x0,h2*2);return}const hh=it.hh,w=x1-x0,cx=(x0+x1)/2;
  if(it.round){
    if(it.stem){g.beginPath();g.moveTo(cx,cy-hh+6);g.quadraticCurveTo(cx+2,cy-hh-12,cx+10,cy-hh-20);g.lineCap='round';g.lineWidth=7;g.strokeStyle=INK;g.stroke();g.lineWidth=3.5;g.strokeStyle=it.stem;g.stroke();g.lineCap='butt'}
    if(it.leaf){g.save();g.translate(cx+14,cy-hh-8);g.rotate(-.5);ell(g,12,0,16,8);fs(g,it.leaf,2.5);g.restore()}
    ell(g,cx,cy,w/2,hh);fs(g,it.body);
    if(it.rings){g.save();ell(g,cx,cy,w/2,hh);g.clip();g.strokeStyle=it.light;g.lineWidth=3;[.32,.64].forEach(f=>{ell(g,cx,cy,w/2*f,hh*.98);g.stroke()});g.restore()}
    ell(g,cx-w*.2,cy-hh*.42,w*.13,hh*.17,-.5);g.fillStyle=it.light;g.fill();
    if(it.seeds){g.fillStyle=it.seeds;for(let i=0;i<14;i++){const a=i*2.39,rr=Math.sqrt((i+.5)/14)*.72;ell(g,cx+Math.cos(a)*rr*w/2,cy+Math.sin(a)*rr*hh,2.6,1.9,a);g.fill()}}
  }else{
    if(it.leaf){g.lineCap='round';[[-30,-26],[-42,0],[-30,24]].forEach(([dx,dy])=>{g.beginPath();g.moveTo(x0+8,cy);g.quadraticCurveTo(x0+dx*.5,cy+dy*.2,x0+dx,cy+dy);g.lineWidth=10;g.strokeStyle=INK;g.stroke();g.lineWidth=5;g.strokeStyle=it.leaf;g.stroke()});g.lineCap='butt'}
    if(it.stemL){rrect(g,x0-18,cy-8,26,16,6);fs(g,it.stemL,2.5)}
    const shape=()=>{if(it.taper){g.beginPath();g.moveTo(x0+hh,cy-hh);g.lineTo(x1-10,cy-hh*.3);g.quadraticCurveTo(x1+6,cy,x1-10,cy+hh*.3);g.lineTo(x0+hh,cy+hh);g.arc(x0+hh,cy,hh,Math.PI/2,Math.PI*1.5);g.closePath()}else rrect(g,x0,cy-hh,w,hh*2,it.block?8:hh)};
    shape();fs(g,it.body);
    if(it.whiteEnd){g.save();shape();g.clip();g.fillStyle='#F2F7E6';g.fillRect(x1-w*.26,cy-hh,w*.26,hh*2);g.restore();shape();g.lineWidth=3;g.strokeStyle=INK;g.stroke()}
    const hw=it.taper?w*.55:w-hh*1.6;rrect(g,x0+hh*.7,cy-hh*.62,hw,Math.max(4,hh*.32),hh*.16);g.fillStyle=it.light;g.fill();
    if(it.tip){g.fillStyle=it.tip;ell(g,x0+5,cy,5,hh*.35);g.fill();ell(g,x1-5,cy,5,hh*.35);g.fill()}
    if(it.taper){g.strokeStyle='rgba(150,70,20,.35)';g.lineWidth=2;for(let x=x0+50;x<x1-40;x+=38){g.beginPath();g.moveTo(x,cy+hh*.15);g.lineTo(x+12,cy+hh*.15);g.stroke()}}
    if(it.seeds){g.fillStyle=it.seeds;for(let i=0;i<16;i++){ell(g,x0+hh*.8+((i*53)%100)/100*(w-hh*1.6),cy+(((i*37)%100)/100-.5)*hh*1.2,3,2.4);g.fill()}}
    if(it.slash){g.strokeStyle='rgba(140,80,20,.55)';g.lineWidth=3;g.lineCap='round';for(let x=x0+40;x<x1-30;x+=44){g.beginPath();g.moveTo(x-8,cy+hh*.5);g.lineTo(x+14,cy-hh*.5);g.stroke()}g.lineCap='butt'}
  }
}

function drawKnife(g,x,ty){const kn=spr('tool-knife');if(kn){const L=150,h=L*kn.height/kn.width;g.save();g.translate(x,ty);g.rotate(-Math.PI/2);drawSpr(g,kn,0,-h/2,L,h);g.restore();return}g.save();g.translate(x,ty);
  g.beginPath();g.moveTo(0,0);g.lineTo(-10,-14);g.lineTo(-10,-80);g.lineTo(10,-80);g.lineTo(10,-10);g.closePath();fs(g,'#DCE4EC');
  g.beginPath();g.moveTo(4,-74);g.lineTo(4,-16);g.lineWidth=2;g.strokeStyle='#FFFFFF';g.stroke();
  rrect(g,-8,-126,16,48,6);fs(g,INK,0);g.fillStyle='#FFC93C';ell(g,0,-112,2.5,2.5);g.fill();ell(g,0,-94,2.5,2.5);g.fill();

const G={};

/* CHOP: tap on each dotted line */
G.chop=(s,d)=>{
  const it=ITEMS[s.item],cy=250,geo=itemGeo(it),hh=geo.hh,x0=geo.x0,x1=geo.x1,mx0=geo.sp?x0+(x1-x0)*.08:x0,mx1=geo.sp?x1-(x1-x0)*.08:x1;
  const marks=[];for(let i=1;i<=s.cuts;i++)marks.push({x:mx0+(mx1-mx0)*i/(s.cuts+1),cut:false,acc:0,at:0});
  const kn={x:200,t:0},reach=22*d.tol,perfect=Math.max(3,5*d.tol);let misses=0;
  return{title:s.t,hint:d.id==='little'?tr('Tap each dotted line to chop.'):tr('Tap right on each dotted line. Misses cost points.'),
    time:4+s.cuts*1.5,done:false,score:0,
    down(x,y){if(this.done)return;kn.x=x;kn.t=.2;
      if(y<cy-hh-100||y>cy+hh+80)return;
      let best=null,bd=1e9;for(const m of marks)if(!m.cut){const dd=Math.abs(m.x-x);if(dd<bd){bd=dd;best=m}}
      if(best&&bd<=reach){best.cut=true;best.at=x;best.t=0;best.acc=bd<=perfect?1:clamp(1-(bd-perfect)/(reach-perfect)*.55,.45,1);
        sfx.chop();FX.burst(x,cy,it.juice,7);FX.pop(best.acc>=1?'Perfect':best.acc>.8?'Good':'OK',x,cy-hh-30,best.acc>=1?'#2F8F5B':INK);
        if(marks.every(m=>m.cut))this.finish()}
      else{sfx.thud();if(d.id!=='little'){misses++;FX.pop('Miss',x,cy-hh-30,'#EF4F3A')}}},
    move(x){if(kn.t<=0)kn.x=x},up(){},
    finish(){this.done=true;const a=marks.reduce((t,m)=>t+(m.cut?m.acc:0),0)/marks.length;this.score=Math.round(clamp(a*100-misses*6,0,100))},
    timeout(){this.finish()},
    update(dt){kn.t=Math.max(0,kn.t-dt);for(const m of marks)if(m.cut)m.t+=dt},
    draw(g){
      board(g,22,cy-hh-48,356,hh*2+96);
      const cm=marks.filter(m=>m.cut).sort((a,b)=>a.at-b.at),cuts=cm.map(m=>m.at),b=[0,...cuts,W],n=cuts.length;
      const spring=t=>{t=Math.min(t/.35,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},gap=16;
      /* the biggest remaining piece stays put; every cut slice slides away from it */
      const ed=[x0,...cuts,x1];let anc=0;for(let j=1;j<=n;j++)if(ed[j+1]-ed[j]>ed[anc+1]-ed[anc])anc=j;
      for(let j=0;j<=n;j++){let off=0;cm.forEach((m,i)=>{if(j>anc&&i>=anc&&i<j)off+=gap*spring(m.t);else if(j<anc&&i>=j&&i<anc)off-=gap*spring(m.t)});g.save();g.translate(off,0);g.beginPath();g.rect(b[j],0,b[j+1]-b[j],H);g.clip();drawItem(g,it,x0,x1,cy,hh);g.restore()}
      g.setLineDash([6,6]);g.lineWidth=2.5;g.strokeStyle='rgba(59,34,24,.6)';
      for(const m of marks)if(!m.cut){g.beginPath();g.moveTo(m.x,cy-hh-14);g.lineTo(m.x,cy+hh+14);g.stroke()}
      g.setLineDash([]);
      const p=kn.t/.2,top=cy-hh-44,ty=top+Math.sin(Math.PI*(1-p))*(hh*1.45+44);
      drawKnife(g,kn.x,kn.t>0?ty:top);
    }};
};

/* STIR: draw circles in the bowl (or spread sauce) */
G.stir=(s,d)=>{if(s.style==='spread')return G.paint(s,d);
  const cx=200,cy=258,R=134,need=s.turns*Math.PI*2,spread=s.style==='spread';
  const maxV=(s.whisk||s.fast?17:s.gentle?8:11)/d.speed;
  let tot=0,la=0,lt=0,vel=0,spills=0,cd=0,px=null,py=null,dn=false,started=false,sl=0;
  return{title:s.t,hint:spread?tr('Swirl round and round to spread the sauce to the edge.'):d.id==='little'?tr('Draw big circles in the bowl.'):tr('Draw circles in the bowl. Go too fast and it splashes out!'),
    time:s.turns*3.5+5,done:false,score:0,
    down(x,y){dn=true;px=x;py=y;la=Math.atan2(y-cy,x-cx);lt=performance.now()},
    move(x,y){px=x;py=y;if(!dn||this.done)return;const r=Math.hypot(x-cx,y-cy),a=Math.atan2(y-cy,x-cx),now=performance.now();
      if(r>18&&r<R+70){let da=a-la;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;const dts=Math.max(.008,(now-lt)/1000);tot+=Math.abs(da);vel=vel*.75+Math.abs(da)/dts*.25;started=true;sl+=Math.abs(da);if(sl>2.2){sl=0;sfx.slosh()}}
      la=a;lt=now;if(tot>=need)this.finish()},
    up(){dn=false;px=null},
    update(dt){vel*=Math.pow(.05,dt);cd-=dt;
      if(d.id!=='little'&&!this.done&&vel>maxV&&cd<=0){spills++;cd=.7;const a=Math.random()*6.283;FX.burst(cx+Math.cos(a)*(R+8),cy+Math.sin(a)*(R+8),s.base,12);FX.pop('Too fast!',cx,cy-R-44,'#EF4F3A');sfx.bad()}},
    finish(){this.done=true;this.score=Math.round(clamp(100-spills*12,15,100))},
    timeout(){this.done=true;this.score=Math.round(clamp(tot/need*85-spills*12,10,85))},
    draw(g){const p=clamp(tot/need,0,1);
      if(spread){
        const dB=spr('dough-base');if(dB)drawSpr(g,dB,cx-R-12,cy-R-12,R*2+24,R*2+24);else{ell(g,cx,cy,R+10,R+10);fs(g,'#E8B76A');ell(g,cx,cy,R-8,R-8);fs(g,'#F6DFAE',2)}
        g.save();ell(g,cx,cy,R-8,R-8);g.clip();const sr=14+(R-20)*p;ell(g,cx,cy,sr,sr);g.fillStyle=s.base;g.fill();
        g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=5;for(let k=0;k<3;k++){g.beginPath();g.arc(cx,cy,sr*(.3+.25*k),tot*.8+k,tot*.8+k+2);g.stroke()}g.restore();
      }else{
        bowl(g,cx,cy,R);g.save();ell(g,cx,cy,R,R);g.clip();
        g.fillStyle=mix(s.colors[0],s.base,p);g.fillRect(cx-R,cy-R,R*2,R*2);
        const pcs=s.pieces&&s.pieces.map(spr).filter(Boolean);if(pcs&&pcs.length){g.globalAlpha=s.keep?1:Math.max(0,1-p*1.1);for(let k=0;k<9;k++){const a=k*.698+tot*.5,rr=R*(k%3===0?.28:k%3===1?.52:.72),im=pcs[k%pcs.length],q=50/Math.max(im.width,im.height);g.save();g.translate(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);g.rotate(k*1.3+tot*(.9+(k%3)*.45)*(k%2?1:-1)+Math.sin(T*1.5+k)*.08*Math.min(1,vel));g.drawImage(im,-im.width*q/2,-im.height*q/2,im.width*q,im.height*q);g.restore()}g.globalAlpha=1}
        else{g.globalAlpha=(1-p)*.95;for(let k=0;k<6;k++){const a=k*1.047+tot*.5,rr=R*(k%2?.32:.62);ell(g,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,32,22,a);g.fillStyle=s.colors[k%s.colors.length];g.fill()}g.globalAlpha=1}
        if(s.whisk){g.fillStyle='rgba(255,255,255,.8)';for(let k=0;k<Math.floor(p*40);k++){const a=k*2.4,rr=R*.9*Math.sqrt((k+1)/41);ell(g,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,6+(k%3)*3,6+(k%3)*3);g.fill()}}
        g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=4;g.lineCap='round';for(let k=0;k<3;k++){g.beginPath();g.arc(cx,cy,R*(.22+.24*k),tot*.8+k*2,tot*.8+k*2+2);g.stroke()}g.lineCap='butt';
        g.restore();ell(g,cx,cy,R,R);g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
      }
      g.lineCap='round';g.beginPath();g.arc(cx,cy,R+32,0,Math.PI*2);g.lineWidth=10;g.strokeStyle='rgba(59,34,24,.12)';g.stroke();
      if(p>0){g.beginPath();g.arc(cx,cy,R+32,-Math.PI/2,-Math.PI/2+Math.PI*2*p);g.strokeStyle='#FFC93C';g.stroke()}g.lineCap='butt';
      if(d.id!=='little'){rrect(g,130,26,140,14,7);fs(g,'#FFFFFF',2.5);const f=clamp(vel/maxV,0,1.2);g.save();rrect(g,130,26,140,14,7);g.clip();g.fillStyle=f>1?'#EF4F3A':f>.8?'#FFC93C':'#2F8F5B';g.fillRect(130,26,140*Math.min(1,f),14);g.restore();text(g,'speed',112,33,13,'#7A5A48','right')}
      const tl=spr(s.whisk?'tool-whisk':'tool-spoon');if(px!==null&&tl){const a=Math.atan2(py-cy,px-cx),W2=150,H2=W2*tl.height/tl.width;g.save();g.translate(px,py);if(s.whisk){g.rotate(a-Math.PI/4);drawSpr(g,tl,-W2*.2,-H2*.22,W2,H2)}else{g.rotate(a-Math.PI*.75);drawSpr(g,tl,-W2*.8,-H2*.2,W2,H2)}g.restore()}
      else if(px!==null){const a=Math.atan2(py-cy,px-cx),ex=px+Math.cos(a)*110,ey=py+Math.sin(a)*110;g.lineCap='round';g.beginPath();g.moveTo(px,py);g.lineTo(ex,ey);g.lineWidth=15;g.strokeStyle=INK;g.stroke();g.lineWidth=9;g.strokeStyle=s.whisk?'#DCE4EC':'#C98B4E';g.stroke();g.lineCap='butt';
        if(s.whisk){g.save();g.translate(px,py);g.rotate(a);for(let k=-1;k<=1;k++){ell(g,-6,0,26,9+Math.abs(k)*6);g.lineWidth=3;g.strokeStyle=INK;g.stroke()}g.restore()}else{ell(g,px,py,22,15,a);fs(g,'#C98B4E')}}
      else if(!started){const a=T*2.4;g.lineCap='round';g.beginPath();g.arc(cx,cy,R*.6,a,a+2.4);g.lineWidth=6;g.strokeStyle='rgba(59,34,24,.45)';g.stroke();const hx=cx+Math.cos(a+2.4)*R*.6,hy=cy+Math.sin(a+2.4)*R*.6,ta=a+2.4+Math.PI/2;g.beginPath();g.moveTo(hx+Math.cos(ta)*14,hy+Math.sin(ta)*14);g.lineTo(hx+Math.cos(ta+2.4)*12,hy+Math.sin(ta+2.4)*12);g.moveTo(hx+Math.cos(ta)*14,hy+Math.sin(ta)*14);g.lineTo(hx+Math.cos(ta-2.4)*12,hy+Math.sin(ta-2.4)*12);g.stroke();g.lineCap='butt'}
    }};
};

/* CRACK: tap when the arrow is in the green */
G.crack=(s,d)=>{
  const cx=200,bowlY=356,R=98,zw=clamp(.22*d.window,.1,.45);
  let i=0,ph=0,zc=.5,state='aim',an=0;const res=[],eggs=[];
  const newZone=()=>{zc=.22+Math.random()*.56};newZone();
  const pos=()=>{const t=ph%2;return t<1?t:2-t};
  const half=(g,side)=>{g.beginPath();if(side<0)g.ellipse(0,0,30,38,0,Math.PI/2,Math.PI*1.5);else g.ellipse(0,0,30,38,0,-Math.PI/2,Math.PI/2);g.closePath();fs(g,'#FFF4E2')};
  return{title:s.t,hint:d.id==='little'?tr('Tap when the arrow is in the green.'):tr('Tap when the arrow is in the color. Dead center keeps shells out.'),
    time:s.n*4+3,done:false,score:0,
    down(){if(state!=='aim'||this.done)return;const e=Math.abs(pos()-zc),q=e<=zw*.18?1:e<=zw/2?.8:.35;res.push(q);state='crack';an=0;
      eggs.push({x:cx+(i-(s.n-1)/2)*50+(Math.random()*12-6),y:bowlY+(Math.random()*18-9),bad:q<.5});
      sfx.crack();FX.pop(q>=1?'Perfect':q>=.8?'Good':'Shells!',cx,150,q<.5?'#EF4F3A':'#2F8F5B')},
    move(){},up(){},
    update(dt){if(this.done)return;if(state==='aim')ph+=dt*1.5*d.speed;else{an+=dt;if(an>.8){i++;if(i>=s.n)this.finish();else{state='aim';newZone()}}}},
    finish(){this.done=true;this.score=Math.round(res.reduce((a,b)=>a+b,0)/s.n*100)},
    timeout(){this.finish()},
    draw(g){

      if(c.pat<=0&&floor===0){c.state='leave';c.t=1.8;B.lost++;B.msg=tr('{n} waited too long and left.',{n:c.name});B.msgT=3;sfx.bad()}}
    else{c.t-=dt;if(c.t<=0){B.seats[i]=null;B.dirty=true;return}}
    const mk=c.state+moodOf(c);if(mk!==c.mk){c.mk=mk;B.dirty=true}});
  if(B.msgT>0){B.msgT-=dt;if(B.msgT<=0)B.dirty=true}
  if(B.toSpawn===0&&B.seats.every(x=>!x))endDay()}
function startDay(){B.on=true;B.seats=[null,null,null];B.total=guestsFor(B.day);B.toSpawn=B.total;B.spawnT=.8;B.served=0;B.lost=0;B.earned=0;B.qual=[];B.msg='';B.msgT=0;$('#bisOverlay').hidden=true;renderBistro()}
function endDay(){B.on=false;const q=B.qual.length?B.qual.reduce((a,b)=>a+b,0)/B.qual.length:0,ratio=B.served/B.total,st=ratio>=1&&q>=85?3:ratio>=.7&&q>=65?2:B.served?1:0;
  const info={day:B.day,served:B.served,total:B.total,lost:B.lost,earned:B.earned,st};B.day++;saveB();renderBistro();bisOverlay('end',info);for(let i=0;i<st;i++)sfx.star(i)}
function serveCustomer(c,avg){const q=avg/100,pr=priceOf(c.r),pay=q>=.5?pr:Math.round(pr*.5/10)*10,tip=Math.max(0,Math.round(pr*.2*q*c.pat*clamp(1.6-pr/priceBase(c.r)*.6,.2,1.5)/10)*10);
  c.state='eat';c.t=3.2;c.eatMood=q>=.85?'happy':q>=.6?'ok':'sad';c.paid=pay+tip;
  B.coins+=pay+tip;B.earned+=pay+tip;B.served++;B.qual.push(avg);saveB();
  B.msg=tip?tr('{n} paid {a} plus {b} tip.',{n:c.name,a:money(pay),b:money(tip)}):tr('{n} paid {a}.',{n:c.name,a:money(pay)});B.msgT=3.2;B.dirty=true;sfx.coin();backToBistro()}
function seatAction(i){const c=B.seats[i];if(!c)return;ac();
  if(c.state==='order'){c.state='wait';sfx.pop();B.dirty=true}
  else if(c.state==='wait'){c.state='cooking';sfx.tap();startRecipe(c.r,c)}}
function renderBistro(){
  $('#bisDay').textContent=tr('Day {n}',{n:B.day});$('#bisCoins').innerHTML=`<span class="coin"></span>${money(B.coins)}`;
  $('#bisStats').innerHTML=B.on?`<span>${tr('Served {n}',{n:B.served})}</span><span>${tr('Left {n}',{n:B.lost})}</span><span>${tr('Still coming {n}',{n:B.toSpawn})}</span><span>${tr('Today')} ${money(B.earned)}</span>${B.msgT>0?`<p class="bis-msg">${B.msg}</p>`:''}`:`<span>${tr('{n} guests tonight',{n:guestsFor(B.day)})} · ${tr(diff.name)}</span>`;
  const wrap=$('#seats');wrap.innerHTML='';
  B.seats.forEach((c,i)=>{const el=document.createElement('div');
    if(!c){el.className='seat empty';el.textContent=tr(B.on&&B.toSpawn>0?'Free table: the next guest is on the way':'Empty table');wrap.appendChild(el);return}
    el.className='seat '+c.state;const ticket=c.state!=='order';
    const md=moodOf(c),gk=String(c.gi+1).padStart(2,'0')+(c.state==='eat'&&md==='happy'?'l':md==='angry'||md==='sad'?'a':'h');el.innerHTML=`<div class="ava">${spr('guest-'+gk)?`<img src="sprites/guest-${gk}.webp" alt="" draggable="false">`:face(c,moodOf(c))}</div><div class="seat-main"><b>${c.name}</b><span class="say">${sayOf(c)}</span>${ticket?`<div class="ticket"><canvas></canvas><span class="dn">${tr(c.r.name)}</span><span class="price">${money(priceOf(c.r))}</span></div>`:''}${c.state==='eat'?`<span class="paid">+${money(c.paid)}</span>`:c.state!=='leave'?'<div class="pat"><i></i></div>':''}</div>${c.state==='order'?`<button class="btn small" type="button">${tr('Take order')}</button>`:c.state==='wait'?`<button class="btn small" type="button">${tr('Cook it')}</button>`:''}`;
    if(ticket)paintThumb(el.querySelector('canvas'),c.r.id,34);
    const b=el.querySelector('button');if(b)b.onclick=()=>seatAction(i);
    c.bar=el.querySelector('.pat');wrap.appendChild(el)});
  patUI()}
function patUI(){B.seats.forEach(c=>{if(c&&c.bar){c.bar.firstChild.style.transform=`scaleX(${c.pat})`;c.bar.className='pat'+(c.pat<.3?' low':c.pat<.6?' mid':'')}})}
function svcUI(){const c=E.service;if(!c)return;const w=B.seats.filter(x=>x&&(x.state==='order'||x.state==='wait')).length;
  $('#svcText').textContent=tr('For {n}',{n:c.name})+(w?' · '+tr('{n} waiting',{n:w}):'');$('#svcFill').style.transform=`scaleX(${c.pat})`;$('#svcFill').parentNode.className='pat'+(c.pat<.3?' low':c.pat<.6?' mid':'')}
function bisOverlay(kind,info){const card=$('#bisCard');$('#bisOverlay').hidden=false;
  card.innerHTML=kind==='start'
    ?`<div class="pip-sm">${mayaHTML('plate')}</div><p class="stepno">${esc(restaurantName())}</p><h3>${tr('Day {n}',{n:B.day})}</h3><p class="hint">${tr('{n} guests are coming. Take each order, cook the dish, and serve it before they run out of patience.',{n:guestsFor(B.day)})}</p><p class="hint" style="font-weight:800">${tr('{n} dishes on the menu',{n:menuPool().length})}</p><button class="btn" id="bisGo" type="button">${tr('Open the doors')}</button><button class="ghost" id="bisEdit" type="button">${tr('Edit menu')}</button>`
    :`<div class="pip-sm">${mayaHTML(info.st>=2?'cheer':'think')}</div><p class="stepno">${tr('Day {n} closed',{n:info.day})}</p><div class="big-stars">${[0,1,2].map(i=>`<span class="${i<info.st?'star':'off'}" style="animation-delay:${.1+i*.18}s">★</span>`).join('')}</div><p class="hint">${tr('Served {a} of {b} guests',{a:info.served,b:info.total})}${info.lost?tr(', {n} left early',{n:info.lost}):''}. ${tr('You earned {n}.',{n:money(info.earned)})}</p><button class="btn" id="bisGo" type="button">${tr('Start day {n}',{n:B.day})}</button>`;
  $('#bisGo').onclick=()=>{ac();sfx.tap();startDay()};const be=$('#bisEdit');if(be)be.onclick=()=>{sfx.tap();openCarte()}}
function renderCarte(){const all=menuable(),grid=$('#carteGrid');grid.innerHTML='';
  all.forEach(r=>{const on=onMenu(r),pr=priceOf(r),pb=priceBase(r),b=document.createElement('div');b.className='card pick'+(on?' on':'');b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-pressed',on);
    b.innerHTML=`<canvas></canvas><span class="cname">${tr(r.name)}</span><span class="cmeta">${tr('{n} steps',{n:svcSteps(r).length})}${pr!==pb?' · '+tr('Standard {n}',{n:money(pb)}):''}</span><span class="pricer"><button class="pbtn" type="button" data-d="-1" aria-label="${tr('Lower price')}">−</button><b>${money(pr)}</b><button class="pbtn" type="button" data-d="1" aria-label="${tr('Raise price')}">+</button></span><span class="onmenu">${tr(on?'On the menu':'Not on the menu')}</span><span class="tick">${on?'✓':''}</span>`;
    paintThumb(b.querySelector('canvas'),r.id,76);
    b.onclick=e=>{const pbn=e.target.closest&&e.target.closest('.pbtn');if(pbn){e.stopPropagation();setPrice(r,priceOf(r)+ +pbn.dataset.d*50);return}toggleCarte(r)};
    b.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===b){e.preventDefault();toggleCarte(r)}};grid.appendChild(b)});
  $('#carteCount').textContent=tr('{n} dishes on the menu',{n:all.filter(onMenu).length})}
function setPrice(r,v){v=clamp(Math.round(v/50)*50,50,3000);if(v===priceBase(r))delete B.prices[r.id];else B.prices[r.id]=v;saveB();sfx.coin();renderCarte()}
function toggleCarte(r){const all=menuable();if(!B.menu)B.menu=all.map(x=>x.id);const i=B.menu.indexOf(r.id),cnt=all.filter(onMenu).length;
  if(i>=0){if(cnt<=1){const w=$('#carteWarn');w.textContent=tr('At least one dish has to stay on the menu.');w.hidden=false;sfx.bad();clearTimeout(toggleCarte.t);toggleCarte.t=setTimeout(()=>{w.hidden=true},2600);return}B.menu.splice(i,1);sfx.tap()}
  else{B.menu.push(r.id);sfx.pop()}
  if(all.every(onMenu))B.menu=null;saveB();renderCarte()}
function openCarte(){$('#carteWarn').hidden=true;renderCarte();show('carte')}
let bisRaf=0,bisLast=0;
function startBis(){if(!bisRaf){bisLast=0;bisRaf=requestAnimationFrame(bisFrame)}}
function stopBis(){if(bisRaf)cancelAnimationFrame(bisRaf);bisRaf=0}
function bisFrame(t){bisRaf=requestAnimationFrame(bisFrame);const dt=Math.min(.05,bisLast?(t-bisLast)/1000:0);bisLast=t;T+=dt;tickBistro(dt);if(B.dirty){B.dirty=false;renderBistro()}patUI()}
function backToBistro(){renderBistro();show('bistro');startBis()}
function openBistro(){backToBistro();if(!B.on)bisOverlay('start')}

/* ============ wiring ============ */
let NEWLV='little';const newLvUI=()=>document.querySelectorAll('#newLevels .level').forEach(b=>{b.classList.toggle('sel',b.dataset.level===NEWLV);b.setAttribute('aria-pressed',b.dataset.level===NEWLV)});
document.querySelectorAll('#newLevels .level').forEach(b=>b.addEventListener('click',()=>{NEWLV=b.dataset.level;ac();sfx.tap();newLvUI()}));
$('#menuBack').onclick=()=>{sfx.tap();renderHome();show('start')};
$('#quitBtn').onclick=()=>{E.state='idle';if(E.service){const c=E.service;E.service=null;if(B.seats.includes(c))c.state='wait';backToBistro();return}renderMenu();show('menu')};
$('#goBtn').onclick=begin;
$('#againBtn').onclick=()=>startRecipe(E.r);
$('#toMenuBtn').onclick=()=>{renderMenu();show('menu')};
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;document.title=tr("Maya's Restaurant")}
function renderSettings(){const box=$('#langs');box.innerHTML='';
  LANGS.forEach(([id,name])=>{const b=document.createElement('button');b.type='button';b.className='lang'+(id===LANG?' on':'');b.innerHTML=`${name}<small>${id.toUpperCase()}</small>`;
    b.onclick=()=>{LANG=id;LANG_SET=true;try{localStorage.setItem('pip-lang',id)}catch(e){}sfx.tap();applyI18n();renderSettings()};box.appendChild(b)});
  const dv=$('#diffs');dv.innerHTML='';[['little','Ages 3–6'],['home','Ages 7–11'],['head','Ages 12+']].forEach(([id,age])=>{const b=document.createElement('button');b.type='button';b.className='lang'+(diff.id===id?' on':'');b.innerHTML=`${tr(LV[id].name)}<small>${tr(age).toUpperCase()}</small>`;
    b.onclick=()=>{diff=LV[id];saveProfile();sfx.tap();renderSettings()};dv.appendChild(b)});
  const d=$('#dbgTgl');d.classList.toggle('on',DEBUG);d.innerHTML=`${tr('Debug: unlock everything')}<small>${tr(DEBUG?'On':'Off').toUpperCase()}</small>`;
  $('#musVol').value=Math.round(MUSV*100);$('#sfxVol').value=Math.round(SFXV*100);$('#musVal').textContent=Math.round(MUSV*100)+'%';$('#sfxVal').textContent=Math.round(SFXV*100)+'%';nowPlayingUI();saveInfoUI();$('#saveMsg').hidden=true}
let SET_PREV='start';
function openSettings(){const cur=['start','menu','cook','done','bistro','carte'].find(id=>!$('#'+id).hidden);if(cur)SET_PREV=cur;renderSettings();show('settings')}
function closeSettings(){ac();sfx.tap();const p=SET_PREV||'start';
  if(p==='bistro'){backToBistro();return}if(p==='carte'){renderCarte();show('carte');return}
  if(p==='menu')renderMenu();if(p==='start')renderHome();show(p);if(p==='cook'){fit();startLoop()}}
$('#gear').onclick=()=>{ac();sfx.tap();openSettings()};$('#setBack').onclick=closeSettings;
$('#toStart').onclick=()=>{ac();sfx.tap();resetRun();renderHome();show('start')};
$('#dbgTgl').onclick=()=>{DEBUG=!DEBUG;try{localStorage.setItem('pip-debug',DEBUG?'1':'0')}catch(e){}sfx.tap();renderSettings()};
/* start screen: load (continue the autosaved game) or start a new one */
function resetRun(){B.on=false;B.seats=[null,null,null];B.toSpawn=0;E.service=null;E.state='idle'}
$('#contBtn').onclick=()=>{ac();sfx.perfect();renderMenu();show('menu')};
$('#loadBtn').onclick=()=>{const sv=readSave();if(!sv)return;ac();resetRun();prog=JSON.parse(JSON.stringify(sv.prog||{}));save();
  const bs=sv.bistro||{};B.day=bs.day||1;B.coins=bs.cents?(bs.coins||0):(bs.coins||0)*100;B.menu=Array.isArray(bs.menu)?bs.menu:null;B.prices=bs.cents&&bs.prices||{};saveB();
  if(LV[sv.level])diff=LV[sv.level];PROFILE={name:sv.profile&&sv.profile.name||'',level:diff.id};saveProfile();sfx.perfect();renderMenu();show('menu')};
function saveInfoUI(){const sv=readSave();$('#saveInfo').textContent=sv?tr('Saved: {d}',{d:saveSummary(sv)}):tr('No saved game yet.')}
function flash(msg){const m=$('#saveMsg');m.textContent=msg;m.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>{m.hidden=true},2600)}
$('#saveBtn').onclick=()=>{ac();try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,t:Date.now(),level:diff.id,profile:{name:PROFILE&&PROFILE.name||''},prog,bistro:{cents:1,day:B.day,coins:B.coins,menu:B.menu,prices:B.prices}}));sfx.good();flash(tr('Game saved!'))}catch(e){sfx.bad();flash(tr('Could not save in this browser.'))}saveInfoUI()};
$('#newBtn').onclick=()=>{ac();sfx.tap();$('#startBtns').hidden=true;$('#newForm').hidden=false;$('#newName').value='';$('#newName').placeholder=tr("Maya's Restaurant");NEWLV=diff.id;newLvUI();$('#newWarn').hidden=!hasGame();$('#newWarn').textContent=tr('This replaces your current game.');try{$('#newName').focus({preventScroll:true})}catch(e){}};
$('#newCancel').onclick=()=>{sfx.tap();$('#newForm').hidden=true;$('#startBtns').hidden=false};
$('#newForm').addEventListener('submit',e=>{e.preventDefault();ac();resetRun();prog={};save();B.day=1;B.coins=0;B.menu=null;B.prices={};saveB();
  diff=LV[NEWLV];PROFILE={name:($('#newName').value||'').trim().slice(0,24),level:NEWLV};saveProfile();
  $('#newForm').hidden=true;$('#startBtns').hidden=false;sfx.perfect();renderMenu();show('menu')});
$('#musVol').oninput=e=>{MUSV=e.target.value/100;$('#musVal').textContent=e.target.value+'%';try{localStorage.setItem('pip-mus-vol',MUSV)}catch(_){}MUS.unlocked=true;musicUpdate()};
$('#sfxVol').oninput=e=>{SFXV=e.target.value/100;$('#sfxVal').textContent=e.target.value+'%';try{localStorage.setItem('pip-sfx-vol',SFXV)}catch(_){}};
$('#sfxVol').onchange=()=>{ac();sfx.good()};
$('#musNext').onclick=()=>{sfx.tap();nextTrack()};
$('#bisBack').onclick=()=>{renderMenu();show('menu')};
$('#bisMenu').onclick=()=>{sfx.tap();openCarte()};
$('#carteBack').onclick=()=>{sfx.tap();backToBistro();if(!B.on)bisOverlay('start')};
$('#carteAll').onclick=()=>{B.menu=null;saveB();sfx.pop();renderCarte()};
window.addEventListener('resize',()=>{if(!$('#cook').hidden){fit();if(E.g)draw()}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!$('#menu').hidden)renderMenu()});

window.refreshArt=()=>{if(!$('#menu').hidden)renderMenu();if(!$('#bistro').hidden)renderBistro();if(!$('#done').hidden&&E.r)paintThumb($('#dishCv'),E.r.id,190);if(!$('#start').hidden)renderHome()};
function boot(data){document.querySelectorAll('[data-pip]').forEach(el=>el.innerHTML=mayaHTML(el.dataset.pip||'idle'));if(data&&data.level&&LV[data.level])diff=LV[data.level];applyI18n();renderHome();show('start')}
window.claude?.hot?.snapshot?.(()=>({level:diff.id}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

</body>
